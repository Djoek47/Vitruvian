name: Test & deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch licensed display font (optional)
        env:
          PLANET_KOSMOS_URL: ${{ secrets.PLANET_KOSMOS_URL }}
        run: |
          if [ -n "$PLANET_KOSMOS_URL" ]; then curl -fsSL "$PLANET_KOSMOS_URL" -o public/fonts/planet-kosmos.woff2 && echo "Planet Kosmos installed"; else echo "PLANET_KOSMOS_URL not set: using Chakra Petch fallback"; fi
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Faberland Vitruvian</title>
    <link rel="icon" href="brand/faberland-star.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Faberland Vitruvian — companion page.
         Identity: faberland.online (near-black, Inter, glass cards, rounded-xl) + the Figma XR system (gold light, ember edge).
         Rhythm: Fibonacci spacing (8 · 13 · 21 · 34 · 55 · 89) and a √φ type scale. */
      :root {
        --gold: #FFC61A; --amber: #F5A81C; --ember: #FF3D00; --green: #22C55E;
        --panel: #0D0B08; --surface: #17130F; --surface2: #211B15; --line: rgba(255, 198, 26, 0.14);
        --text: #FFF6E6; --text2: #D4CBBE; --text3: #9A9083; --ok: #22C55E; --err: #FF2E88; --info: #5BC8FF;
        --s1: 8px; --s2: 13px; --s3: 21px; --s4: 34px; --s5: 55px; --s6: 89px;
        --r1: 8px; --r2: 13px; --r3: 21px;
        --display: "Planet Kosmos", "Chakra Petch", Inter, sans-serif;
        --t-sm: 13px; --t-base: 16px; --t-md: 21px; --t-lg: 26px; --t-xl: 34px; --t-2xl: 55px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: var(--t-base); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      body {
        background:
          radial-gradient(1200px 610px at 72% -12%, rgba(255, 198, 26, 0.11), transparent 62%),
          linear-gradient(rgba(255, 198, 26, 0.025) 1px, transparent 1px) 0 0 / 55px 55px,
          linear-gradient(90deg, rgba(255, 198, 26, 0.025) 1px, transparent 1px) 0 0 / 55px 55px,
          linear-gradient(135deg, #000 0%, #14110D 50%, #000 100%);
        background-attachment: fixed;
        min-height: 100vh;
      }
      #stage { position: fixed; inset: 0; z-index: 0; visibility: hidden; }
      body.preview #stage { visibility: visible; z-index: 5; }
      body.preview #landing { display: none; }
      #landing { position: relative; z-index: 2; max-width: 987px; margin: 0 auto; padding: var(--s4) var(--s3) var(--s6); }

      /* hero */
      .hero { position: relative; display: flex; gap: var(--s4); align-items: center; margin: var(--s2) 0 var(--s4); min-height: 233px; }
      .hero .canon { position: absolute; right: -34px; top: -21px; width: 260px; opacity: 0.55; pointer-events: none; }
      .hero .star { width: 144px; filter: drop-shadow(0 0 34px rgba(255, 120, 0, 0.45)); animation: pulse 5s ease-in-out infinite; }
      .hero .wordmark { width: 300px; display: block; }
      .hero h1 { font-family: var(--display); font-style: italic; font-weight: 700; letter-spacing: 0.18em; color: var(--gold); margin: var(--s2) 0 var(--s1); font-size: var(--t-xl); }
      html.kosmos .hero h1, html.kosmos h2 { font-style: normal; }
      .tag { color: var(--text2); margin: 0; max-width: 560px; line-height: 1.618; font-size: var(--t-md); font-weight: 400; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

      /* tabs */
      nav.tabs { display: flex; gap: var(--s1); flex-wrap: wrap; margin: 0 0 var(--s2); position: sticky; top: 0; z-index: 3; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(13px); -webkit-backdrop-filter: blur(13px); padding: var(--s2) 0; }
      nav.tabs button { min-height: 42px; padding: var(--s1) var(--s3); border-radius: 999px; }

      /* cards: site-style glass, gold hairline (Figma panel chrome) */
      .card { position: relative; background: linear-gradient(180deg, rgba(33, 27, 21, 0.78), rgba(13, 11, 8, 0.78)); border: 1px solid var(--line); border-radius: var(--r3); padding: var(--s3) var(--s4); margin: var(--s3) 0; overflow: hidden; backdrop-filter: blur(21px); -webkit-backdrop-filter: blur(21px); box-shadow: 0 4px 21px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2); }
      .card::before { content: ""; position: absolute; left: var(--s4); right: var(--s4); top: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(255, 198, 26, 0.6), transparent); }
      h2 { font-family: var(--display); font-style: italic; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin: 0 0 var(--s2); font-size: var(--t-lg); }
      h2 .dim { font-family: Inter, sans-serif; font-style: normal; letter-spacing: 0; text-transform: none; font-size: var(--t-base); }
      h3 { font-size: var(--t-sm); letter-spacing: 0.21em; text-transform: uppercase; color: var(--text3); margin: var(--s4) 0 var(--s2); font-weight: 700; }
      p, li { line-height: 1.618; color: var(--text2); }
      .plain { padding-left: var(--s3); }
      .dim { color: var(--text3); font-size: 0.9em; }
      .ok { color: var(--ok); } .ember { color: var(--ember); }
      .warn { background: rgba(255, 61, 0, 0.1); border: 1px solid rgba(255, 61, 0, 0.35); padding: var(--s2) var(--s3); border-radius: var(--r2); color: var(--text); }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px var(--s2); border-radius: 999px; font-size: var(--t-sm); font-weight: 700; letter-spacing: 0.05em; border: 1px solid currentColor; }
      .pill.ok { color: var(--ok); } .pill.no { color: var(--text3); }
      .row { display: flex; gap: var(--s2); margin-top: var(--s3); align-items: center; } .wrap { flex-wrap: wrap; }

      /* controls */
      button { font: 600 15px Inter, sans-serif; color: var(--text2); background: var(--surface2); border: 1px solid rgba(255, 198, 26, 0.2); border-radius: var(--r2); padding: var(--s2) var(--s3); cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, color 0.15s, transform 0.08s; min-height: 48px; }
      button:hover:not(:disabled) { color: var(--text); border-color: var(--gold); box-shadow: 0 0 21px rgba(255, 198, 26, 0.3); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      button:disabled { opacity: 0.38; cursor: not-allowed; filter: grayscale(0.6); box-shadow: none; }
      button.primary { background: linear-gradient(135deg, var(--gold) 0%, var(--amber) 50%, var(--gold) 100%); color: #0D0B08; border: 0; box-shadow: 0 4px 21px rgba(255, 166, 0, 0.25); }
      button.ghost { background: transparent; }
      button.sm { padding: 6px var(--s2); min-height: 34px; font-size: var(--t-sm); }
      button.danger { color: var(--err); background: rgba(255, 46, 136, 0.08); border-color: rgba(255, 46, 136, 0.4); }
      .check { display: flex; gap: var(--s2); align-items: center; margin: var(--s2) 0; color: var(--text); }
      .check input { width: 21px; height: 21px; accent-color: var(--gold); }
      .field { display: flex; flex-direction: column; gap: 6px; color: var(--text3); font-size: var(--t-sm); font-weight: 600; letter-spacing: 0.02em; }
      .field:not([style]) { max-width: 377px; }
      input:not([type=checkbox]):not([type=file]), select, textarea, .tape { background: var(--surface2); border: 1px solid rgba(255, 198, 26, 0.18); color: var(--text); border-radius: var(--r1); padding: 10px var(--s2); font: 500 15px Inter, sans-serif; min-height: 44px; }
      input[type=file] { color: var(--text3); font: 500 14px Inter; }
      input[type=file]::file-selector-button { font: 600 14px Inter; color: var(--text); background: var(--surface2); border: 1px solid rgba(255, 198, 26, 0.3); border-radius: var(--r1); padding: 10px var(--s2); margin-right: var(--s2); cursor: pointer; }
      input[type=file]:disabled::file-selector-button { opacity: 0.4; cursor: not-allowed; }
      .tape { width: 110px; }
      .hint { font-size: 14px; color: var(--text3); }

      /* tables, badges */
      table { width: 100%; border-collapse: collapse; margin-top: var(--s1); }
      td { padding: 10px var(--s1); border-bottom: 1px solid rgba(255, 246, 230, 0.06); color: var(--text2); vertical-align: top; }
      td.num { text-align: right; font-family: "Chakra Petch", Inter, sans-serif; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
      td.code { letter-spacing: 0.21em; color: var(--gold); font-size: var(--t-md); }
      tr.conflicted td:first-child { color: var(--ember); }
      .badge { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px var(--s1); border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); white-space: nowrap; }
      .badge.direct { background: var(--gold); color: var(--panel); }
      .badge.estimated { border-color: var(--text3); color: var(--text3); }
      .badge.manual, .badge.conflicted { border-color: var(--ember); color: var(--ember); }
      .badge.st-fits-comfortably { background: var(--ok); color: var(--panel); border-color: var(--ok); }
      .badge.st-becoming-tight, .badge.st-undetermined { border-color: var(--amber); color: var(--amber); }
      .badge.st-may-no-longer-fit, .badge.st-too-loose { border-color: var(--ember); color: var(--ember); }
      .badge.st-may-fit-after-change { border-color: var(--info); color: var(--info); }
      .badge.st-needs-info { border-color: var(--text3); color: var(--text3); }

      /* evolution */
      .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; } .seg button { min-height: 38px; padding: 6px var(--s2); }
      nav.tabs button.on, .seg button.on, button.on { background: linear-gradient(135deg, var(--gold), var(--amber)); color: var(--panel); border-color: transparent; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(144px, 1fr)); gap: var(--s2); margin: var(--s2) 0; }
      .stat { background: var(--surface2); border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s2) var(--s3); }
      .stat b { display: block; font: 600 var(--t-lg) "Chakra Petch", Inter, sans-serif; color: var(--gold); } .stat span { color: var(--text3); font-size: var(--t-sm); }
      .viewer-host { width: 100%; margin: var(--s2) 0; } canvas.viewer { width: 100%; height: auto; border-radius: var(--r3); display: block; background: #0D0B08; touch-action: none; border: 1px solid var(--line); }
      .legend { font-size: var(--t-sm); color: var(--text3); display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; } .sw { display: inline-block; width: 13px; height: 13px; border-radius: 4px; }
      .sw.inc { background: #FFC61A; } .sw.dec { background: #5BC8FF; } .sw.pos { background: #8a7a50; } .sw.stb { background: #6b6154; }
      .regions { display: grid; grid-template-columns: repeat(auto-fit, minmax(233px, 1fr)); gap: var(--s2); } .region { background: var(--surface2); border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s2); font-size: 14px; }
      .region b { text-transform: capitalize; color: var(--gold); } .significant { color: var(--text); } .possible { color: var(--amber); } .stable { color: var(--text3); }
      tr.significant td:first-child { color: var(--gold); }
      svg.chart { width: 100%; height: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); } svg .ax { fill: var(--text3); font: 12px Inter; } svg .gl { stroke: rgba(255, 246, 230, 0.06); }
      svg .eb { stroke: rgba(255, 198, 26, 0.45); stroke-width: 2; } svg .ln { fill: none; stroke: rgba(255, 198, 26, 0.5); stroke-width: 2; } svg .tr { stroke: #5BC8FF; stroke-dasharray: 6 5; stroke-width: 2; }
      svg circle.scan { fill: #FFC61A; } svg circle.chk { fill: #0D0B08; stroke: #D4CBBE; stroke-width: 2; }
      .warnline { border-left: 3px solid var(--ember); padding: var(--s1) var(--s2); background: rgba(255, 61, 0, 0.08); border-radius: 6px; color: var(--text); }
      .snaplist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px var(--s2); } .snaplist .check { margin: 4px 0; font-size: 14px; }
      .garment, .prog { background: var(--surface2); border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s2) var(--s3); margin: var(--s2) 0; }
      details summary { cursor: pointer; color: var(--text2); margin: var(--s1) 0; }
      textarea { width: 100%; }
      code { background: var(--surface2); padding: 1px 6px; border-radius: 6px; color: var(--text); }
      .tone { display: flex; gap: var(--s2); align-items: center; margin-top: var(--s2); } .swatch { display: inline-block; width: 55px; height: 55px; border-radius: var(--r2); border: 2px solid rgba(255, 246, 230, 0.2); vertical-align: middle; } .swatch.sm { width: 21px; height: 21px; border-radius: 5px; }
      .ctrl-art svg { width: 100%; max-width: 760px; height: auto; display: block; margin: 0 auto var(--s2); }
      footer { color: var(--text3); font-size: 12px; text-align: center; margin-top: var(--s4); }
      @media (max-width: 640px) { .hero { flex-direction: column; align-items: flex-start; } .hero .canon { display: none; } .row { flex-direction: column; align-items: stretch; } .card { padding: var(--s3); } }
      @media (prefers-reduced-motion: reduce) { .hero .star { animation: none; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <main id="landing"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

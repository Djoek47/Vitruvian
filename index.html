<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0B08" />
    <title>Faberland Vitruvian</title>
    <link rel="icon" href="brand/faberland-star.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      :root { --gold:#FFC61A; --amber:#F5A81C; --ember:#FF3D00; --panel:#0D0B08; --surface:#1A1611; --surface2:#231E17; --text:#FFF6E6; --text2:#C9BFB0; --text3:#8A8176; --ok:#3DD68C; --err:#FF2E88; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--panel); color: var(--text); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
      body { background: radial-gradient(1200px 600px at 70% -10%, rgba(255,198,26,0.10), transparent 60%), linear-gradient(rgba(255,198,26,0.03) 1px, transparent 1px) 0 0/48px 48px, linear-gradient(90deg, rgba(255,198,26,0.03) 1px, transparent 1px) 0 0/48px 48px, var(--panel); }
      #stage { position: fixed; inset: 0; z-index: 0; visibility: hidden; }
      body.preview #stage { visibility: visible; z-index: 5; }
      body.preview #landing { display: none; }
      #landing { position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
      .hero { display: flex; gap: 28px; align-items: center; margin: 12px 0 28px; }
      .hero .star { width: 120px; filter: drop-shadow(0 0 24px rgba(255,120,0,0.45)); animation: pulse 4s ease-in-out infinite; }
      .hero .wordmark { width: 280px; display: block; }
      .hero h1 { font-family: 'Chakra Petch', sans-serif; font-style: italic; font-weight: 700; letter-spacing: 0.18em; color: var(--gold); margin: 6px 0 6px; font-size: 44px; }
      .tag { color: var(--text2); margin: 0; max-width: 560px; line-height: 1.5; }
      @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.04);} }
      .card { position: relative; background: rgba(26,22,17,0.82); border-radius: 22px; padding: 22px 24px; margin: 18px 0; overflow: hidden; }
      .card::before { content:''; position:absolute; left:22px; right:22px; top:0; height:2px; background: rgba(255,198,26,0.5); }
      .card::after { content:''; position:absolute; inset:10px; pointer-events:none; border: 2px solid transparent; border-image: linear-gradient(90deg, var(--gold) 0 30px, transparent 30px calc(100% - 30px), var(--gold) calc(100% - 30px)) 1; opacity: .5; clip-path: polygon(0 0, 40px 0, 40px 2px, calc(100% - 40px) 2px, calc(100% - 40px) 0, 100% 0, 100% 40px, 100% calc(100% - 40px), 100% 100%, calc(100% - 40px) 100%, 40px 100%, 0 100%, 0 calc(100% - 40px), 0 40px); }
      h2 { font-family: 'Chakra Petch', sans-serif; font-style: italic; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; font-size: 22px; }
      h3 { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--text3); margin: 22px 0 10px; }
      p, li { line-height: 1.55; color: var(--text2); }
      .plain { padding-left: 18px; }
      .dim { color: var(--text3); font-size: 0.92em; }
      .ok { color: var(--ok); } .ember { color: var(--ember); }
      .warn { background: rgba(255,61,0,0.12); border-left: 4px solid var(--ember); padding: 12px 16px; border-radius: 10px; color: var(--text); }
      .row { display: flex; gap: 12px; margin-top: 16px; } .wrap { flex-wrap: wrap; }
      button { font: 600 15px Inter, sans-serif; color: var(--text2); background: var(--surface2); border: 1px solid rgba(255,198,26,0.22); border-radius: 14px; padding: 14px 18px; cursor: pointer; transition: .15s; min-height: 48px; }
      button:hover:not(:disabled) { color: var(--text); border-color: var(--gold); box-shadow: 0 0 18px rgba(255,198,26,0.35); }
      button:disabled { opacity: .35; cursor: not-allowed; }
      button.primary { background: linear-gradient(var(--gold), var(--amber)); color: var(--panel); border: 0; }
      button.ghost { background: transparent; }
      button.sm { padding: 6px 10px; min-height: 32px; font-size: 13px; }
      button.danger { color: var(--err); background: rgba(255,46,136,0.08); border-color: rgba(255,46,136,0.4); }
      .check { display: flex; gap: 10px; align-items: center; margin: 14px 0; color: var(--text); }
      .check input { width: 22px; height: 22px; accent-color: var(--gold); }
      .field { display: flex; flex-direction: column; gap: 6px; color: var(--text3); font-size: 13px; max-width: 360px; }
      input[type=text], input:not([type]), .field input, .tape { background: var(--surface2); border: 1px solid rgba(255,198,26,0.2); color: var(--text); border-radius: 10px; padding: 10px 12px; font: 500 15px Inter; }
      .tape { width: 110px; }
      .hint { font-size: 14px; color: var(--text3); }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      td { padding: 9px 6px; border-bottom: 1px solid rgba(255,246,230,0.06); color: var(--text2); }
      td.num { text-align: right; font-family: 'Chakra Petch', sans-serif; color: var(--text); font-weight: 600; }
      tr.conflicted td:first-child { color: var(--ember); }
      .badge { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--gold); color: var(--gold); }
      .badge.direct { background: var(--gold); color: var(--panel); }
      .badge.estimated { border-color: var(--text3); color: var(--text3); }
      .badge.manual, .badge.conflicted { border-color: var(--ember); color: var(--ember); }
      nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; position: sticky; top: 0; z-index: 3; background: rgba(13,11,8,0.92); padding: 8px 0; }
      nav.tabs button { min-height: 40px; padding: 8px 14px; border-radius: 999px; }
      nav.tabs button.on, .seg button.on, button.on { background: linear-gradient(var(--gold), var(--amber)); color: var(--panel); border-color: transparent; }
      .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; } .seg button { min-height: 36px; padding: 6px 12px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
      .stat { background: var(--surface2); border-radius: 14px; padding: 14px; } .stat b { display: block; font: 600 26px 'Chakra Petch'; color: var(--gold); } .stat span { color: var(--text3); font-size: 13px; }
      .viewer-host { width: 100%; margin: 10px 0; } canvas.viewer { width: 100%; height: auto; border-radius: 16px; display: block; background: #0D0B08; touch-action: none; }
      .legend { font-size: 13px; color: var(--text3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; }
      .sw.inc { background: #FFC61A; } .sw.dec { background: #5BC8FF; } .sw.pos { background: #8a7a50; } .sw.stb { background: #6b6154; }
      .regions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; } .region { background: var(--surface2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
      .region b { text-transform: capitalize; color: var(--gold); } .significant { color: var(--text); } .possible { color: var(--amber); } .stable { color: var(--text3); }
      tr.significant td:first-child { color: var(--gold); }
      svg.chart { width: 100%; height: auto; background: var(--surface); border-radius: 14px; } svg .ax { fill: var(--text3); font: 12px Inter; } svg .gl { stroke: rgba(255,246,230,0.06); }
      svg .eb { stroke: rgba(255,198,26,0.45); stroke-width: 2; } svg .ln { fill: none; stroke: rgba(255,198,26,0.5); stroke-width: 2; } svg .tr { stroke: #5BC8FF; stroke-dasharray: 6 5; stroke-width: 2; }
      svg circle.scan { fill: #FFC61A; } svg circle.chk { fill: #0D0B08; stroke: #C9BFB0; stroke-width: 2; }
      .warnline { border-left: 3px solid var(--ember); padding: 6px 10px; background: rgba(255,61,0,0.08); border-radius: 6px; color: var(--text); }
      .snaplist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px 12px; } .snaplist .check { margin: 4px 0; font-size: 14px; }
      .garment, .prog { background: var(--surface2); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
      .badge.st-fits-comfortably { background: var(--ok); color: var(--panel); border-color: var(--ok); } .badge.st-becoming-tight, .badge.st-undetermined { border-color: var(--amber); color: var(--amber); }
      .badge.st-may-no-longer-fit, .badge.st-too-loose { border-color: var(--ember); color: var(--ember); } .badge.st-may-fit-after-change { border-color: #5BC8FF; color: #5BC8FF; } .badge.st-needs-info { border-color: var(--text3); color: var(--text3); }
      details summary { cursor: pointer; color: var(--text2); margin: 6px 0; } textarea { width: 100%; background: var(--surface2); color: var(--text); border: 1px solid rgba(255,198,26,0.2); border-radius: 10px; padding: 10px; font: 14px Inter; }
      select, input[type=date], input[type=datetime-local], input[type=number] { background: var(--surface2); color: var(--text); border: 1px solid rgba(255,198,26,0.2); border-radius: 10px; padding: 8px 10px; font: 500 14px Inter; }
      code { background: var(--surface2); padding: 1px 6px; border-radius: 6px; color: var(--text); }
      .tone { display: flex; gap: 14px; align-items: center; margin-top: 10px; } .swatch { display: inline-block; width: 56px; height: 56px; border-radius: 14px; border: 2px solid rgba(255,246,230,0.2); vertical-align: middle; } .swatch.sm { width: 18px; height: 18px; border-radius: 5px; }
      .ctrl-art svg { width: 100%; max-width: 760px; height: auto; display: block; margin: 0 auto 12px; }
      td.code { letter-spacing: .2em; color: var(--gold); font-size: 20px; }
      footer { color: var(--text3); font-size: 12px; text-align: center; margin-top: 32px; }
      @media (max-width: 640px) { .hero { flex-direction: column; align-items: flex-start; } .row { flex-direction: column; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <main id="landing"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
